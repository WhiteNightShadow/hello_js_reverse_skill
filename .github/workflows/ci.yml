name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install requests pycryptodome
      - run: npm --prefix templates/node-request test
      - run: npm --prefix templates/vm-sandbox test
      - run: npm --prefix templates/wasm-loader test
      - run: npm --prefix templates/browser-auto test
      - run: npm --prefix templates/env-bundle test
      - run: node --test tests/test-sandbox.js tests/test-request.js
      - run: python templates/python-request/test.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
